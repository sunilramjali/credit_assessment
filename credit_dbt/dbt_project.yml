
name: 'credit_dbt'
version: '1.0.0'

# Which profile in profiles.yml to use.
profile: 'credit_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  credit_dbt:
    staging:
      # Table, not view: this is where SQLite data lands in DuckDB and gets
      # typed once. Everything downstream reads DuckDB, never SQLite.
      +materialized: table
    intermediate:
      # View: build-time steps only, no need to store the rows.
      +materialized: view
    marts:
      # Table: final output, read often by notebooks and charts.
      +materialized: table
