version: 2

models:
  - name: mart_portfolio_yearly
    description: >
      Annual portfolio performance by loan origination year. One row represents
      one origination year. This model supports analysis of funded-loan volume,
      observed loss frequency and realised loss severity over time.

    config:
      materialized: table

    columns:
      - name: origination_year
        description: "Calendar year in which the loan application was received."
        data_tests:
          - unique
          - not_null

      - name: funded_loan_count
        description: "Number of distinct funded loans originated during the year."
        data_tests:
          - not_null

      - name: loss_loan_count
        description: "Number of loans where is_loss equals 1."
        data_tests:
          - not_null

      - name: observed_loss_rate
        description: >
          Proportion of funded loans where is_loss equals 1. This is an
          observed-to-date rate and does not adjust for loan maturity or
          incomplete seasoning.
        data_tests:
          - not_null

      - name: total_recorded_loss_amount
        description: >
          Sum of loss_amount across all loans, including zero and negative
          recorded amounts.

      - name: total_positive_loss_amount
        description: >
          Sum of positive loss_amount values only. Negative recoveries or
          adjustments are excluded.

      - name: average_loss_per_funded_loan
        description: >
          Average recorded loss amount across all funded loans in the
          origination year.

      - name: average_loss_severity
        description: >
          Mean loss_amount among loans where is_loss equals 1. Sensitive to
          large loss observations and target inconsistencies.

      - name: median_loss_severity
        description: >
          Median loss_amount among loans where is_loss equals 1. This is less
          sensitive to extreme losses than average severity.

      - name: maximum_loss_amount
        description: "Largest recorded loss_amount in the origination year."


  - name: mart_portfolio_seasonality
    description: >
      Quarterly portfolio performance separated by origination year. One row
      represents one calendar quarter within one origination year. This model
      supports comparison of origination-quarter patterns across years.

      The quarter grain is chosen over a monthly grain so that each cohort
      carries enough loans for its observed loss rate to be readable. Loans are
      unevenly spread across the calendar, and 2021 Q2 to Q4 contain no funded
      loans at all, so those quarters are absent from this model rather than
      present with a zero count.

    config:
      materialized: table

    columns:
      - name: origination_year_quarter_key
        description: >
          Unique year-quarter identifier in YYYY-Qn format for the quarterly
          origination cohort.
        data_tests:
          - unique
          - not_null

      - name: origination_year
        description: "Calendar year in which the loan application was received."
        data_tests:
          - not_null

      - name: origination_quarter_number
        description: >
          Numeric calendar quarter from 1 for January to March through 4 for
          October to December. This field should be used to sort
          origination_quarter_name.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]

      - name: origination_quarter_name
        description: >
          Short calendar quarter label used as the x-axis label in the
          seasonality chart.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Q1
                  - Q2
                  - Q3
                  - Q4

      - name: origination_quarter_start
        description: >
          First date of the origination quarter. This can be used for
          chronological filtering and time-series visualisations.
        data_tests:
          - not_null

      - name: funded_loan_count
        description: >
          Number of distinct funded loans received during the year-quarter
          cohort.
        data_tests:
          - not_null

      - name: loss_loan_count
        description: "Number of loans in the cohort where is_loss equals 1."
        data_tests:
          - not_null

      - name: observed_loss_rate
        description: >
          Proportion of loans in the year-quarter cohort where is_loss equals 1.
          This measures performance by quarter of origination, not the quarter
          in which the loss occurred.
        data_tests:
          - not_null

      - name: total_recorded_loss_amount
        description: >
          Sum of loss_amount for the quarterly origination cohort, including
          zero and negative recorded amounts.

      - name: total_positive_loss_amount
        description: >
          Sum of positive loss_amount values for the quarterly origination
          cohort.

      - name: average_loss_per_funded_loan
        description: >
          Average recorded loss amount across every funded loan in the quarterly
          origination cohort.

      - name: average_loss_severity
        description: >
          Mean loss_amount among quarterly cohort loans where is_loss equals 1.

      - name: median_loss_severity
        description: >
          Median loss_amount among quarterly cohort loans where is_loss
          equals 1.